  <script src="script.js"></script>
  <script>
    // ── Particle Canvas ──────────────────────────────────────────────
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const PARTICLE_COUNT = 60;

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    function randomBetween(a, b) { return a + Math.random() * (b - a); }

    class Particle {
      constructor() { this.reset(true); }
      reset(initial) {
        this.x = randomBetween(0, canvas.width);
        this.y = initial ? randomBetween(0, canvas.height) : canvas.height + 10;
        this.size = randomBetween(1, 2.5);
        this.speedX = randomBetween(-0.3, 0.3);
        this.speedY = randomBetween(-0.5, -0.15);
        this.opacity = randomBetween(0.1, 0.45);
        this.color = Math.random() > 0.5 ? '#FF4D00' : '#ff8a57';
        this.pulse = randomBetween(0, Math.PI * 2);
        this.pulseSpeed = randomBetween(0.005, 0.02);
      }
      update() {
        this.x += this.speedX; this.y += this.speedY; this.pulse += this.pulseSpeed;
        if (this.y < -10) this.reset(false);
      }
      draw() {
        const alpha = this.opacity * (0.7 + 0.3 * Math.sin(this.pulse));
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        ctx.fill();
      }
    }

    function drawConnections() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 85) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(255,77,0,${(1 - dist / 85) * 0.1})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawConnections();
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ── GSAP ──────────────────────────────────────────────
    gsap.registerPlugin(ScrollTrigger);

    gsap.fromTo('#topbar', { y: -70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: 'power3.out' });

    gsap.fromTo('#page-head',
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.65, ease: 'power3.out', delay: 0.2 }
    );
    gsap.fromTo('#toolbar',
      { x: 30, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.6, ease: 'power2.out', delay: 0.35 }
    );
    gsap.fromTo('#stats-box',
      { y: 20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out', delay: 0.5 }
    );

    // Animate newly rendered question cards
    function animateCards() {
      gsap.fromTo('.question-card',
        { y: 40, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, stagger: 0.06, ease: 'power3.out' }
      );
    }

    // Hook into script.js renderQuestions by observing DOM
    const observer = new MutationObserver(() => { animateCards(); });
    const grid = document.getElementById('questionGrid');
    if (grid) observer.observe(grid, { childList: true });

    window.addEventListener('scroll', () => {
      document.getElementById('topbar').classList.toggle('scrolled', window.scrollY > 40);
    });
  </script>
